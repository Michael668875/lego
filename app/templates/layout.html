<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LEGO Site Theme Mockups</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  </head>
<body>

  <div class="container py-5">
    <h1 class="display-4 fw-bold mb-3">LEGO Site Theme Mockups</h1>
    <p class="lead text-secondary">
      Three possible visual directions for your LEGO pricing and tracking site.
    </p>
  </div>

  <section class="theme2">
    <div class="container">
      {{ macro.titles() }}

      <div class="mockup-wrapper">

        {{ macro.navigation(country) }}

        <div class="p-4 p-lg-5">
  {% block content %}{% endblock %}
          </div>
          </div>
    </div>
  </section>
</body>
</html>
